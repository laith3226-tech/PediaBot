name: PediaBot Production

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Publish mode"
        required: true
        default: brief
        type: choice
        options:
          - brief
          - reveal

  schedule:
    - cron: "0 17 * * *" # 20:00 Qatar
    - cron: "0 19 * * *" # 22:00 Qatar

permissions:
  contents: write

concurrency:
  group: pediabot-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Self-check
        run: python pediabot.py selfcheck

      - name: Select mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 19 * * *" ]; then
            echo "value=reveal" >> "$GITHUB_OUTPUT"
          else
            echo "value=brief" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_CHAT_ID: "@LaythPeds"
          MODE: ${{ steps.mode.outputs.value }}
        run: python pediabot.py

      - name: Persist daily state
        if: steps.mode.outputs.value == 'brief'
        shell: bash
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "PediaBot"
          git config user.email "actions@users.noreply.github.com"

          git add data/state.json
          git commit -m "PediaBot: persist daily state"
          git push
